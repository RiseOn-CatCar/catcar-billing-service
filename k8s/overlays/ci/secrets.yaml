apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
type: Opaque
stringData:
  ConnectionStrings__billing: Host=postgres;Port=5432;Database=catcar_billing;Username=catcar;Password=catcar_ci
  ConnectionStrings__messaging: amqp://catcar:catcar_ci@rabbitmq:5672/
  Jwt__Secret: ci-only-signing-secret-not-for-production-1234567890
  Jwt__Issuer: catcar
  Jwt__Audience: catcar
  Communication__EmailTransport: Mailpit
  Communication__MailpitBaseUrl: http://mailpit:8025
  Communication__SenderAddress: billing@catcar.example
  Communication__ExternalBaseUrl: http://billing-service:8080
